<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazePod Controller v4 – twee pods</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#f8fafc;margin:0;padding:18px}main{max-width:720px;margin:auto}h1{font-size:25px;margin-bottom:5px}p,small{color:#b8c5d8}section{border:1px solid #40516b;border-radius:16px;padding:16px;margin:16px 0;background:#18253a}button{font:inherit;border:0;border-radius:11px;padding:12px 14px;margin:5px 4px 5px 0;background:#2978ee;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}.green{background:#15803d}.red{background:#b91c1c}.off{background:#475569}.status{font-weight:600;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#050b16;padding:15px;border-radius:12px;min-height:150px;font-size:12px;max-height:330px;overflow:auto}.muted{font-size:13px;color:#a8b5c8}</style></head><body><main>
<h1>BlazePod Controller v4</h1><p>Test twee originele BlazePods tegelijk via Safari + beacio. Selecteer bij de tweede verbinding een <strong>andere fysieke pod</strong>.</p>
<section id="slot1"><h2>Pod 1</h2><div class="status" id="state1">Niet verbonden</div><button id="connect1">Verbind pod 1</button><button id="disconnect1" disabled>Verbreek</button><div><button class="green" id="green1" disabled>Groen</button><button class="red" id="red1" disabled>Rood</button><button class="off" id="off1" disabled>Uit</button></div><button id="listen1" disabled>Luister naar tikken</button><div class="muted" id="info1">Nog geen advertentiedata</div></section>
<section id="slot2"><h2>Pod 2</h2><div class="status" id="state2">Niet verbonden</div><button id="connect2">Verbind pod 2</button><button id="disconnect2" disabled>Verbreek</button><div><button class="green" id="green2" disabled>Groen</button><button class="red" id="red2" disabled>Rood</button><button class="off" id="off2" disabled>Uit</button></div><button id="listen2" disabled>Luister naar tikken</button><div class="muted" id="info2">Nog geen advertentiedata</div></section>
<button id="alloff">Beide uit</button><button id="clear">Log wissen</button><h3>Diagnoselog</h3><pre id="log"></pre>
<script>
const UART='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',COLOR_SERVICE='50c97bfa-4cb8-4c84-b745-0e58a0280cd6',COLOR='50c912a2-4cb8-4c84-b745-0e58a0280cd6',TAP_SERVICE='50c928bd-4cb8-4c84-b745-0e58a0280cd6',TAP='50c9727e-4cb8-4c84-b745-0e58a0280cd6';
const $=id=>document.getElementById(id);const pods=[null,{device:null,rx:null,color:null,tap:null,listener:null,listening:false,busy:false,connected:false,manufacturer:null,disconnectHandler:null},{device:null,rx:null,color:null,tap:null,listener:null,listening:false,busy:false,connected:false,manufacturer:null,disconnectHandler:null}];
function log(i,s){$('log').textContent+=new Date().toLocaleTimeString()+'  '+(i?'[Pod '+i+'] ':'')+s+'\n';$('log').scrollTop=$('log').scrollHeight}
function tohex(a){return [...a].map(v=>v.toString(16).padStart(2,'0')).join(' ').toUpperCase()}
function handshakeFromManufacturer(data){if(data.length<8)throw Error('Minstens 8 advertentiebytes vereist');let tail=data.slice(-5),offset=tail[0],crc=0xffffffff,poly=(0xedb88321+(offset%50))>>>0;for(let b of tail.slice(1)){crc=(crc^b)>>>0;for(let j=0;j<8;j++)crc=crc&1?((crc>>>1)^poly)>>>0:crc>>>1}crc=(crc^0xffffffff)>>>0;crc=(crc+((crc<<3)>>>0))>>>0;crc=(crc^(crc>>>11))>>>0;crc=(crc+((crc<<15)>>>0))>>>0;return Uint8Array.of(0x73,0x65,0x61,crc&255,(crc>>>8)&255,(crc>>>16)&255,(crc>>>24)&255)}
function controls(i){let p=pods[i];$('connect'+i).disabled=p.busy||p.connected;$('disconnect'+i).disabled=!p.connected;$('green'+i).disabled=!p.connected||!p.color;$('red'+i).disabled=!p.connected||!p.color;$('off'+i).disabled=!p.connected||!p.color;$('listen'+i).disabled=!p.connected||!p.tap||p.listening;$('listen'+i).textContent=p.listening?'Luisteren actief':'Luister naar tikken'}
function cleanup(i){const p=pods[i];if(p.tap&&p.listener){try{p.tap.removeEventListener('characteristicvaluechanged',p.listener)}catch(e){}}p.listener=null;p.listening=false;p.rx=p.color=p.tap=null;p.connected=false;p.busy=false;p.manufacturer=null;$('state'+i).textContent='Niet verbonden';controls(i)}
function getManufacturer(e){let v=e.manufacturerData?.get?.(0x09D7);if(!v)return null;return Uint8Array.of(0xD7,0x09,...new Uint8Array(v.buffer,v.byteOffset,v.byteLength))}
async function waitAdvertisement(i,device){if(typeof device.watchAdvertisements!=='function')throw Error('watchAdvertisements niet ondersteund');return new Promise((resolve,reject)=>{let settled=false;let timer;const finish=(err,data)=>{if(settled)return;settled=true;clearTimeout(timer);device.removeEventListener('advertisementreceived',handler);err?reject(err):resolve(data)};const handler=e=>{const data=getManufacturer(e);if(data)finish(null,data)};timer=setTimeout(()=>finish(Error('Geen actuele advertentiedata binnen 8 seconden')),8000);device.addEventListener('advertisementreceived',handler);Promise.resolve().then(()=>device.watchAdvertisements()).catch(e=>finish(e))})}
async function connect(i){const p=pods[i];if(p.busy||p.connected)return;p.busy=true;$('state'+i).textContent='Apparaat kiezen...';controls(i);let device=null;try{if(!navigator.bluetooth)throw Error('Web Bluetooth niet beschikbaar; controleer beacio');device=await navigator.bluetooth.requestDevice({filters:[{name:'BlazePod'}],optionalManufacturerData:[0x09D7],optionalServices:[UART,COLOR_SERVICE,TAP_SERVICE,'battery_service','device_information']});const other=pods[i===1?2:1];if(other.device&&other.connected&&device.id===other.device.id)throw Error('Dit is dezelfde pod als de andere verbinding. Kies een andere.');p.device=device;log(i,'Gekozen: '+(device.name||'BlazePod'));$('state'+i).textContent='Actuele advertentiedata zoeken...';const data=await waitAdvertisement(i,device);p.manufacturer=data;$('info'+i).textContent='Manufacturer: '+tohex(data);log(i,'Manufacturer: '+tohex(data));$('state'+i).textContent='Verbinden...';const server=await device.gatt.connect();device.addEventListener('gattserverdisconnected',p.disconnectHandler=()=>{log(i,'VERBINDING VERBROKEN');cleanup(i)});p.rx=await(await server.getPrimaryService(UART)).getCharacteristic(RX);p.color=await(await server.getPrimaryService(COLOR_SERVICE)).getCharacteristic(COLOR);p.tap=await(await server.getPrimaryService(TAP_SERVICE)).getCharacteristic(TAP);log(i,'GATT en kenmerken gevonden');const handshake=handshakeFromManufacturer(data);log(i,'Handshake: '+tohex(handshake));await p.rx.writeValue(handshake);log(i,'Handshake verstuurd (acceptatie niet expliciet bevestigd)');p.connected=true;$('state'+i).textContent='Verbonden – handshake verstuurd';log(i,'Klaar voor kleur- en tiktest')}catch(e){log(i,'VERBINDINGSFOUT: '+e.message);$('state'+i).textContent='Fout: '+e.message;try{device?.gatt?.disconnect()}catch(_){}cleanup(i);$('state'+i).textContent='Fout: '+e.message}finally{p.busy=false;controls(i)}}
async function setColor(i,g,b,r){let p=pods[i];try{if(!p.connected||!p.color)throw Error('Pod niet verbonden');await p.color.writeValue(Uint8Array.of(g,b,r,1));log(i,'Kleur ingesteld')}catch(e){log(i,'KLEURFOUT: '+e.message)}}
async function listen(i){let p=pods[i];try{if(!p.tap)throw Error('Tik-characteristic ontbreekt');if(p.listening)return;p.listener=e=>{let v=e.target.value;const a=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);log(i,'TIK/NOTIFICATIE: '+tohex(a))};p.tap.addEventListener('characteristicvaluechanged',p.listener);await p.tap.startNotifications();p.listening=true;log(i,'Tiknotificaties actief')}catch(e){if(p.listener&&p.tap)p.tap.removeEventListener('characteristicvaluechanged',p.listener);p.listener=null;log(i,'NOTIFICATIEFOUT: '+e.message)}finally{controls(i)}}
for(let i of [1,2]){$('connect'+i).onclick=()=>connect(i);$('disconnect'+i).onclick=()=>pods[i].device?.gatt?.disconnect();$('green'+i).onclick=()=>setColor(i,255,0,0);$('red'+i).onclick=()=>setColor(i,0,0,255);$('off'+i).onclick=()=>setColor(i,0,0,0);$('listen'+i).onclick=()=>listen(i);controls(i)}
$('alloff').onclick=()=>Promise.all([1,2].filter(i=>pods[i].connected).map(i=>setColor(i,0,0,0)));$('clear').onclick=()=>$('log').textContent='';log(0,'Versie 4 geladen. Verbind eerst pod 1, daarna pod 2.');
</script></main></body></html>
